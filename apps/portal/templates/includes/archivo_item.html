<div class="archivo-item">
    <div>
        <div class="archivo-nombre">{{ archivo.nombre_original }}</div>
        <div class="archivo-meta">
            Subido por {{ archivo.subido_por.email }} • {{ archivo.subido_en|date:"d M Y, H:i" }}
        </div>
    </div>
    <div class="archivo-actions-cell">
        <div class="archivo-tamano">
            {{ archivo.tamano|filesizeformat }}
        </div>
        <div class="archivo-botones">
            <a href="{% url 'documentos:descargar_archivo' archivo.pk %}" class="link-descargar">⬇ Descargar</a>
            {% if puede_borrar or archivo.puede_borrar %}
            <form action="{% url 'documentos:eliminar_archivo' archivo.pk %}" method="post" class="form-eliminar" data-confirmar="¿Seguro? El archivo dejará de verse para todos.">
                {% csrf_token %}
                <button type="submit" class="btn-eliminar">🗑 Eliminar</button>
            </form>
            {% endif %}
        </div>
    </div>
</div>
