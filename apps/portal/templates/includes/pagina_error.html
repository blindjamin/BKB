{% load static %}
{# Esquema común de las páginas de error (docs/09 §5.6). Solo texto fijo: nunca el mensaje de la excepción. #}
<section class="pagina-error" aria-labelledby="pagina-error-titulo">
    <svg class="icono pagina-error-icono" aria-hidden="true"><use href="{% static 'icons.svg' %}#alerta"></use></svg>
    <h1 id="pagina-error-titulo">{{ titulo }}</h1>
    <p>{{ frase }}</p>
    <a href="/" class="btn-primary">Volver a proyectos</a>
    <p class="pagina-error-ayuda">
        ¿Necesitas ayuda? Llama a BKB:
        <a href="tel:+56989753095">+56 9 8975 3095</a>
        <a href="tel:+56961911593">+56 9 6191 1593</a>
    </p>
</section>
