{% load static %}
<li class="encargado-fila">
    <div class="form-group">
        <label for="{{ form.nombre.id_for_label }}">{{ form.nombre.label }}</label>
        {{ form.nombre }}
        {% for error in form.nombre.errors %}
            <div class="field-error" role="alert">
                <svg class="icono field-error-icon" aria-hidden="true"><use href="{% static 'icons.svg' %}#alerta"></use></svg>
                <span>{{ error }}</span>
            </div>
        {% endfor %}
    </div>
    <div class="form-group">
        <label for="{{ form.email.id_for_label }}">{{ form.email.label }}</label>
        {{ form.email }}
        {% for error in form.email.errors %}
            <div class="field-error" role="alert">
                <svg class="icono field-error-icon" aria-hidden="true"><use href="{% static 'icons.svg' %}#alerta"></use></svg>
                <span>{{ error }}</span>
            </div>
        {% endfor %}
    </div>
    <div class="hito-fila-quitar">
        <label class="checkbox-label" for="{{ form.DELETE.id_for_label }}">{{ form.DELETE }} Quitar</label>
    </div>
</li>
