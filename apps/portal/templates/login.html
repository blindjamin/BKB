{% extends "base.html" %}

{% block title %}Iniciar Sesión - BKB Portal{% endblock %}

{% block content %}
<div class="auth-container">
    <div style="text-align: center; margin-bottom: 1.5rem;">
        <svg width="80" height="32" viewBox="0 0 100 40" fill="var(--bkb-salmon-500)" aria-hidden="true">
            <text x="0" y="30" font-family="sans-serif" font-weight="bold" font-size="30">BKB</text>
        </svg>
    </div>
    
    <h1>Portal de Archivos</h1>
    
    {% if form.errors %}
        <p class="text-danger text-center">Correo o contraseña incorrectos.</p>
    {% endif %}

    <form method="post" action="{% url 'login' %}">
        {% csrf_token %}
        <div class="form-group">
            <label for="id_username">Correo</label>
            <input type="email" name="username" id="id_username" required autofocus>
        </div>
        <div class="form-group">
            <label for="id_password">Contraseña</label>
            <input type="password" name="password" id="id_password" required>
        </div>
        <button type="submit" class="btn-primary">Entrar</button>
    </form>
</div>
{% endblock %}
