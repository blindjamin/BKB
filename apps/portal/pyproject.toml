[project]
name = "bkb-portal"
version = "0.1.0"
description = "Portal de Clientes y Gestión Documental Segura BKB"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "django>=5.1.0,<6.2.0",
    "gunicorn>=23.0.0",
    "whitenoise>=6.8.0",
    "psycopg[binary]>=3.2.0",
    "dj-database-url>=2.3.0",
    "django-allauth>=65.4.0",
    "django-axes>=7.0.0",
    "django-rules>=3.5.0",
    "argon2-cffi>=23.1.0",
    "django-csp>=4.0.0",
    "django-storages[boto3]>=1.14.4",
    "boto3>=1.35.0",
    "django-htmx>=1.21.0",
    "python-dotenv>=1.0.1",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py", "*_test.py"]
