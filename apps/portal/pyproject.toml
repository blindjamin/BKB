readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "django>=5.2,<5.3",
    "gunicorn>=23.0.0",
    "whitenoise>=6.8.0",
    "psycopg[binary]>=3.2.0",
    "dj-database-url>=2.3.0",
    "django-axes>=7.0.0",
    "argon2-cffi>=23.1.0",
    "django-csp>=4.0.0",
    "django-storages[boto3]>=1.14.4",
    "boto3>=1.35.0",
    "python-dotenv>=1.0.1",
]
